[package]
name = "audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The kira backend needs ALSA dev headers (alsa-lib-devel) to link on Linux
# (installed on the build box 2026-08-30); `--no-default-features` builds the
# silent no-op API on boxes without them.
default = ["backend"]
backend = ["dep:kira"]

[dependencies]
kira = { workspace = true, optional = true }
anyhow = { workspace = true }
pak = { path = "../pak" }
